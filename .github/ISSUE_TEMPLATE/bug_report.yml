name: Bug report
description: A wrong result, a crash, a disagreement between ports, or a build failure.
labels: [bug]
body:
  - type: dropdown
    id: port
    attributes:
      label: Port
      multiple: true
      options: [Python, C++, Rust, Java, API_SPEC / goldens, Docs, CI]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "1.2.0 or a commit SHA"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest input or command that shows the problem. Small covariance matrices or return panels inline are ideal.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed
      description: What API_SPEC.md, a paper, another port or the golden file gives, and what you got, with the numbers.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS; Python / compiler / rustc / JDK version"
