version: 2
updates:
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # portopt is a library: its floors state the oldest versions it
    # supports. Raise one only when a new release falls outside it.
    versioning-strategy: increase-if-necessary
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Newer criterion needs a Rust newer than the crate's MSRV (1.78);
      # it is a dev-only benchmark dependency, so it does not set the MSRV.
      - dependency-name: "criterion"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: maven
    directory: /java
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The tag is the Rust version the MSRV job tests, not an action version.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions:
        patterns: ["*"]
