[package]
name = "portopt"
version = "1.3.0"
edition = "2021"
rust-version = "1.78"
description = "Portfolio construction: Markowitz, Black-Litterman, risk parity (portfolio-construction reference port)"
license = "MIT"
repository = "https://github.com/AshJha0/portfolio-construction"
homepage = "https://ashjha0.github.io/portfolio-construction/"
documentation = "https://ashjha0.github.io/portfolio-construction/"
readme = "../README.md"
keywords = ["portfolio", "markowitz", "black-litterman", "risk-parity", "optimization"]
categories = ["finance", "mathematics", "science"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "demo"
path = "src/bin/demo.rs"

# Benchmarks only (cargo bench); not linked into the library. Default
# features off: no plotting or rayon, which keeps the tree on MSRV 1.78.
[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "kernels"
harness = false
